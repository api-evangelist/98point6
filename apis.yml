aid: 98point6
name: 98point6 Technologies
description: '98point6 Technologies is a Seattle-based digital health software company,
  founded in 2015, that builds and licenses a cloud-based virtual care platform to
  health systems, payers and virtual care providers. After selling its own care-delivery
  division in 2023 it operates purely as a licensed software provider. The platform
  combines an AI-driven Automated Assistant for patient intake and visit documentation,
  a web-based Clinician Console with automated clinical decision support, and a white-labeled
  patient application, covering both asynchronous and real-time (messaging, audio,
  video) care. It advertises HL7 and FHIR based EMR integration with Epic and Cerner,
  SSO for patient login, and an SDK for building a fully branded patient experience,
  but that integration surface is delivered under a licensing agreement, so no developer
  portal, API reference or machine-readable specification is published publicly.'
